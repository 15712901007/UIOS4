[pytest]
# pytest配置文件

# 测试目录
testpaths = tests

# 测试文件命名模式
python_files = test_*.py *_test.py

# 测试类命名模式
python_classes = Test*

# 测试函数命名模式
python_functions = test_*

# 命令行参数
addopts = -v -s --tb=short --alluredir=reports/allure-results

# 标记
markers =
    vlan: VLAN设置模块测试
    network: 网络配置模块测试
    login: 登录模块测试
    slow: 慢速测试
    smoke: 冒烟测试
    regression: 回归测试
    udp_proxy: UDPXY设置模块测试
    igmp_proxy: IGMP代理模块测试
    iptv: IPTV透传模块测试
    nat_rule: NAT规则模块测试
    port_map: 端口映射模块测试
    dmz_host: DMZ主机模块测试
    security: 安全中心模块测试
    acl: ACL规则模块测试
    conn_limit: 连接数限制模块测试
    mac_access_control: MAC访问控制模块测试
    arp_setting: ARP设置模块测试
    app_protocol: 应用协议控制模块测试
    advanced: 高级设置模块测试
    other_control: 其他控制模块测试
    p0: P0冒烟-核心CRUD/导入导出/批量(必跑)
    p1: P1功能-全协议/全动作/优先级排序(常规回归)
    p2: P2边界-异常输入/越界/极端值(可选)

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
