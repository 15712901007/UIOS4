[pytest]
# pytest配置文件

# 测试目录
testpaths = tests

# 测试文件命名模式
python_files = test_*.py *_test.py

# 测试类命名模式
python_classes = Test*

# 测试函数命名模式
python_functions = test_*

# 命令行参数
addopts = -v -s --tb=short --alluredir=reports/allure-results

# 标记
markers =
    vlan: VLAN设置模块测试
    network: 网络配置模块测试
    login: 登录模块测试
    slow: 慢速测试
    smoke: 冒烟测试
    regression: 回归测试
    udp_proxy: UDPXY设置模块测试
    igmp_proxy: IGMP代理模块测试
    iptv: IPTV透传模块测试
    nat_rule: NAT规则模块测试
    port_map: 端口映射模块测试
    dmz_host: DMZ主机模块测试
    dns_accelerate: DNS加速服务模块测试
    dns_multi_line: 多线路DNS服务模块测试
    security: 安全中心模块测试
    acl: ACL规则模块测试
    conn_limit: 连接数限制模块测试
    mac_access_control: MAC访问控制模块测试
    arp_setting: ARP设置模块测试
    terminal_name: 安全中心-终端名称管理模块测试
    threat_intelligence: 安全中心-威胁情报中心模块测试
    app_protocol: 应用协议控制模块测试
    advanced: 高级设置模块测试
    other_control: 其他控制模块测试
    device_setting: 设备设置模块测试
    basic_setting: 设备设置-基础设置模块测试
    alg_setting: 设备设置-高级管理-ALG设置模块测试
    protocol_control: 设备设置-高级管理-协议控制模块测试
    kernel_setting: 设备设置-高级管理-内核设置模块测试
    cloud_service_binding: 设备设置-云服务绑定模块测试
    advanced_service: 高级服务模块测试
    ftp_server: 高级服务-本地服务-FTP服务模块测试
    samba_server: 高级服务-本地服务-Samba服务模块测试
    http_server: 高级服务-本地服务-HTTP服务模块测试
    snmp_server: 高级服务-本地服务-SNMP服务模块测试
    virtual_machine: 高级服务-虚拟机模块测试
    gre_tunnel: 虚拟专网-GRE隧道模块测试
    ipsec_vpn: 虚拟专网-IPsec VPN模块测试
    ospf: 网络配置-OSPF模块测试
    custom_protocol: 网络配置-自定义协议模块测试
    advanced_custom_protocol: 网络配置-高级自定义协议模块测试
    auth: 认证服务模块测试
    ppp_package: 认证服务-套餐管理模块测试
    pppuser: 认证服务-账号管理模块测试
    ppp_passwd: 认证服务-自助密码管理模块测试
    ppp_paylog: 认证服务-总账管理模块测试
    coupon: 认证服务-上网码模块测试
    p0: P0冒烟-核心CRUD/导入导出/批量(必跑)
    p1: P1功能-全协议/全动作/优先级排序(常规回归)
    p2: P2边界-异常输入/越界/极端值(可选)

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
