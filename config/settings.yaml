# 爱快路由器4.0自动化测试配置文件

# 设备配置（当前主身份为10.66.0.45；可用DEVICE_IP临时覆盖）
device:
  ip: "10.66.0.45"
  username: "admin"
  password: "admin123"
  port: 80
  timeout: 30000

# 浏览器配置
browser:
  browser_type: "chromium"  # chromium, firefox, webkit
  headless: false  # headed模式: 物理混合子接入drawer在headless下关闭动画不完成(UI残留连锁), headed正常
  slow_mo: 0
  timeout: 30000
  screenshot_on_failure: false  # 默认关闭: 截图base64内嵌会撑大HTML报告(单张~244KB), 全量跑易超10M; 需要时GUI勾选
  video_on_failure: false

# 报告配置
report:
  output_dir: "reports/output"
  template_dir: "reports/templates"
  screenshot_dir: "reports/screenshots"
  report_name_prefix: "test_report"

# SSH后台验证配置
ssh:
  ospf_peer_host: "10.66.0.56"
  ospf_peer_port: 22
  ospf_peer_recovery_host: "10.66.0.57"
  ospf_peer_recovery_port: 22
  router_recovery_host: "10.66.0.27"
  router_recovery_port: 22
  router_lan_management_host: "192.168.148.1"
  router_lan_management_port: 22
  # 内核设置L5流量对端（Ubuntu；SSH认证复用client）
  kernel_peer_host: "10.66.0.57"
  kernel_peer_port: 22
  # 路由器SSH主身份；LAN1独立恢复通道见router_lan_management_host
  router:
    host: "10.66.0.45"
    username: "sshd"
    password: "ikuai8.com"
    port: 22
    # 控制台登录凭据（当SSH进入交互式菜单时自动登录）
    console_username: "whoami"
    console_password: "haohao!!xuexi@@tiantian##xiangshang"
  # Ubuntu测试客户端SSH
  client:
    host: "10.66.0.18"
    username: "iktest"
    password: "iktest"
    port: 22
  # GRE隧道对端设备SSH(虚拟专网-GRE L5双端数据面验证; 与router同凭据)
  peer:
    host: "10.66.0.56"
    username: "sshd"
    password: "ikuai8.com"
    port: 22
    console_username: "whoami"
    console_password: "haohao!!xuexi@@tiantian##xiangshang"
  # iperf3测速服务器
  iperf3_server: "10.66.0.40"
  # iperf3测速参数
  iperf3_duration: 10  # 测速时长（秒）
  iperf3_tolerance: 0.20  # 允许的带宽误差（20%）

# 测试数据配置
test_data:
  # 导出文件存放目录（相对于项目根目录）
  export_dir: "test_data/exports"
